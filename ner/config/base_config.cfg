# ner/config/base_config.cfg
# ==========================
# spaCy training configuration for the baseline NER model.
#
# USAGE
# -----
# This file is passed directly to spaCy's training CLI:
#     spacy train ner/config/base_config.cfg \
#         --output models/ner_baseline \
#         --paths.train data/processed/cuad_ner_train.spacy \
#         --paths.dev   data/processed/cuad_ner_dev.spacy \
#         --gpu-id -1
#
# PHASE 1 DECISIONS
# -----------------
# - GPU: disabled (gpu_id = -1, CPU only)
# - Base model: en_core_web_lg (large — better word vectors for legal text)
# - Epochs: 20 (sufficient for baseline; increase in Phase 2)
# - Batch size: 32 (safe for CPU RAM; increase with GPU in Phase 2)
#
# OVERRIDING VALUES
# ------------------
# Any value here can be overridden from command line:
#     spacy train ... --training.max_epochs 30
# Or programmatically via ner/train.py's overrides dict.
#
# SECTION GUIDE
# -------------
# [paths]       → file paths (overridden by CLI args in train.py)
# [system]      → GPU / CPU setting
# [nlp]         → base model and pipeline components
# [components]  → NER component configuration
# [training]    → training loop hyperparameters
# [optimizer]   → Adam with weight decay
# [initialize]  → warm-start from en_core_web_lg vectors

[paths]
train = "data/processed/cuad_ner_train.spacy"
dev = "data/processed/cuad_ner_dev.spacy"

# NOTE: implementation will fill in all sections below.
# These are placeholder comments explaining what each section controls.

# [system]
# GPU device ID: -1 = CPU, 0 = first GPU
# gpu_allocator = null   (use "pytorch" or "tensorflow" with GPU)

# [nlp]
# lang = "en"
# pipeline = ["tok2vec", "ner"]
# batch_size = 32         ← processed in one forward pass

# [components]
# [components.tok2vec]
#   Uses en_core_web_lg's pre-trained tok2vec weights as starting point.
#   This gives the model word vector representations before NER training.
#
# [components.ner]
#   model type = TransitionBasedParser (default spaCy NER)
#   Labels: all 41 CUAD labels + 4 core NER labels (ORG, DATE, MONEY, GPE)
#   These are added dynamically by cuad_to_ner.py via DocBin

# [training]
# accumulate_gradient = 1      (gradient accumulation steps)
# dev_corpus = "corpora.dev"
# train_corpus = "corpora.train"
# max_epochs = 20              ← overrideable from settings
# dropout = 0.1
# patience = 5                 ← early stopping: stop if no improvement for 5 evals
# eval_frequency = 200         ← evaluate every 200 steps

# [optimizer]
# @optimizers = "Adam.v1"
# beta1 = 0.9
# beta2 = 0.999
# L2 = 1e-6                   ← L2 weight decay (regularisation)
# grad_clip = 1.0             ← gradient clipping (prevents exploding gradients)
# use_averages = false
# eps = 1e-8

# [initialize]
# vectors = "en_core_web_lg"  ← warm-start: copy word vectors from this model
# init_tok2vec = null         ← set to a pretrained tok2vec .bin for domain adaptation
